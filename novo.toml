[package]
name        = "noble-hci"
version     = "0.1.1"
description = "The Bluetooth HCI seam both the Host and the Controller read: opcode and event constants, one builder per command, one reader per field, the H4 frame codec, and the BdAddr and Uuid types.  Stateless: no state, no effects, no limits."
license     = "Apache-2.0"
stability   = "experimental"
category    = "networking"
layer       = "core"
tags        = ["bluetooth", "ble", "hci", "h4", "uuid", "bd-addr", "codec"]
repository  = "https://github.com/novolang/noble-hci"
maintainers = ["novo-lang"]
novo        = ">= 0.21.1"

# A library: no `main`, so `novo pkg build` type-checks and effect-checks every
# module under `src/` and writes no binary.

# The embedded tier of orbit/ble, whose Host and Controller depend on this package.
[tier]
tier   = "embedded"
target = "nrf52832-dk"

# Every module is written for the embedded tier and is checked against it in full: a list is built with `list.with_capacity` and
# `list.try_push`, and the few records and strings that must be heap values are built in a `system` block.

[docs.pages]
"README.md"    = "The HCI seam of the noble stack"
"docs/hci.md"  = "Commands, events and frames"

[publish]
coverage_floor = 0

[dependencies]
# None.  Every module reads and writes bytes the caller holds; `std.bits` and `std.test` are the only imports.
